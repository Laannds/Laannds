<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03050D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mundial 26">
<title>Mundial 2026</title>
<style>
:root{
  --bg:#03050D;--surface:rgba(255,255,255,0.055);--border:rgba(255,255,255,0.09);
  --red:#FF0A2B;--red2:#C70021;--gold:#FFB800;--green:#00C853;
  --text:#F0F2F8;--muted:#5C6478;--sub:#8892A4;
  --radius:22px;--r-sm:14px;--r-xs:10px;
  --blur:blur(18px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;height:100%}

/* ── LAYOUT ── */
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-width:500px;margin:0 auto}
#content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#content::-webkit-scrollbar{display:none}
.page{padding:24px 16px 110px;animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.page{animation:none;opacity:1}}

/* ── NAV ── */
#nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;
  background:rgba(5,8,18,0.92);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--border);
  padding-bottom:max(env(safe-area-inset-bottom),8px);
  z-index:200;display:flex;
}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;border:none;background:none;color:var(--muted);cursor:pointer;transition:color .2s;position:relative}
.nb svg{width:23px;height:23px;transition:transform .2s}
.nb.on{color:var(--red)}
.nb.on svg{transform:scale(1.12)}
.nb-label{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.nb-pip{position:absolute;top:8px;right:calc(50% - 18px);width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}

/* ── TYPOGRAPHY ── */
.title{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1}
.subtitle{font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:.01em}
.section-hd{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:24px 0 10px}

/* ── GLASS CARD ── */
.glass{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.glass-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm)}

/* ── LIVE HERO ── */
.live-hero{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;margin-bottom:14px;
  background:linear-gradient(135deg,#1A0008 0%,#380010 40%,#1F0008 100%);
  border:1px solid rgba(255,10,43,0.35);
}
.live-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 120% 80% at 80% 10%,rgba(255,10,43,0.18) 0%,transparent 60%);
}
.live-hero::after{
  content:'⚽';position:absolute;right:-12px;bottom:-14px;font-size:100px;opacity:.07;
  filter:blur(1px);pointer-events:none;
}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,10,43,0.2);border:1px solid rgba(255,10,43,0.4);border-radius:100px;padding:4px 10px;margin-bottom:14px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite}
.live-txt{font-size:10px;font-weight:800;color:#FF6680;letter-spacing:.1em;text-transform:uppercase}
.hero-round{font-size:10px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:18px}
.hero-match{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-flag{font-size:52px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.hero-code{font-size:14px;font-weight:900;letter-spacing:.04em;color:rgba(255,255,255,.75)}
.hero-center{text-align:center}
.hero-vs{font-size:28px;font-weight:900;color:rgba(255,255,255,.18);letter-spacing:.02em}
.hero-time{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px;font-weight:600}
.hero-venue{font-size:10px;color:rgba(255,255,255,.28);text-align:center;margin-top:16px;font-weight:500}

/* ── MATCH CARD ── */
.mc{border-radius:var(--r-sm);padding:13px 14px;margin-bottom:8px;border:1px solid var(--border);background:var(--surface);transition:transform .15s,background .15s}
.mc.live-card{border-color:rgba(255,10,43,.35);background:rgba(255,10,43,.06)}
.mc:active{transform:scale(.985)}
.mc-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.mc-label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.badge-live{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#FF6680}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite;display:block}
.badge-end{font-size:9.5px;font-weight:800;color:var(--green)}
.badge-prox{font-size:9.5px;font-weight:700;color:var(--gold)}
.mc-body{display:flex;align-items:center;gap:6px}
.mc-team{display:flex;align-items:center;gap:8px;flex:1}
.mc-team.right{justify-content:flex-end;flex-direction:row-reverse}
.mc-flag{font-size:28px;line-height:1;flex-shrink:0}
.mc-name{font-size:13px;font-weight:700;color:var(--text);max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-score{font-size:22px;font-weight:900;letter-spacing:-.03em;min-width:52px;text-align:center;color:var(--text)}
.mc-vs{font-size:14px;font-weight:700;color:var(--muted);min-width:46px;text-align:center}
.mc-city{font-size:9.5px;color:var(--muted);text-align:center;margin-top:8px}

/* ── HOME HEADER ── */
.home-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.home-badge{border-radius:16px;padding:9px 14px;text-align:center;background:rgba(255,10,43,.12);border:1px solid rgba(255,10,43,.25)}
.home-badge-lbl{font-size:9px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.home-badge-val{font-size:24px;font-weight:900;line-height:1.1;margin-top:1px}

/* ── MINI GRID ── */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-card{border-radius:var(--r-sm);padding:12px;background:var(--surface);border:1px solid var(--border)}
.mini-g{font-size:9px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.mini-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mini-pos{font-size:9px;font-weight:800;width:10px;color:var(--gold)}
.mini-flag{font-size:17px}
.mini-name{font-size:11.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-pts{font-size:13px;font-weight:900;color:var(--gold)}

/* ── GROUPS ── */
.grp-item{border-radius:var(--r-sm);overflow:hidden;margin-bottom:8px;border:1px solid var(--border);background:var(--surface)}
.grp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;cursor:pointer;-webkit-user-select:none;user-select:none}
.grp-hd:active{background:rgba(255,255,255,.04)}
.grp-badge{background:rgba(255,10,43,.16);color:var(--red);font-size:11px;font-weight:900;border-radius:8px;padding:3px 9px;letter-spacing:.03em}
.grp-flags{display:flex;gap:4px;font-size:20px;margin-left:10px;flex:1}
.grp-arrow{color:var(--muted);transition:transform .25s cubic-bezier(.22,1,.36,1);flex-shrink:0}
.grp-body{border-top:1px solid var(--border);display:none}
.grp-body.open{display:block}

/* STANDINGS */
.st-wrap{padding:14px 15px;overflow-x:auto}
.st{width:100%;border-collapse:collapse;font-size:11px}
.st th{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:0 4px 9px;text-align:center}
.st th:first-child,.st td:first-child{text-align:left;padding-left:0}
.st th:last-child,.st td:last-child{color:var(--gold)}
.st td{padding:5px 4px;text-align:center;color:var(--sub)}
.st .pts{font-weight:900;color:var(--text);font-size:13px}
.st-q td:nth-child(2) span.sname{color:var(--text);font-weight:700}
.st-nq{opacity:.38}
.q-ind{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;vertical-align:middle}

/* GROUP MATCHES */
.gm-block{padding:0 15px 14px}
.gm-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.gm-row{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 10px;margin-bottom:5px;font-size:11px}
.gm-day{color:var(--muted);font-weight:700;width:12px;text-align:center;flex-shrink:0;font-size:10px}
.gm-score{font-weight:900;color:var(--text);font-size:13px;min-width:34px;text-align:center}
.gm-code{color:var(--sub);font-size:10.5px;font-weight:600;flex:1}
.gm-code.right{text-align:right}

/* ── FIXTURE TABS ── */
.tabs{display:flex;gap:5px;background:rgba(255,255,255,.05);border-radius:16px;padding:4px;margin-bottom:16px}
.tab-btn{flex:1;padding:9px 4px;font-size:13px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:all .22s cubic-bezier(.22,1,.36,1);background:none;color:var(--muted);-webkit-appearance:none}
.tab-btn.on{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(255,10,43,.35)}
.date-grp{margin-bottom:22px}
.date-lbl{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:4px 0;margin-bottom:8px;position:sticky;top:-1px;background:var(--bg);z-index:10;padding-top:6px}

/* ── BUTTONS ── */
.btn{width:100%;padding:17px;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:800;cursor:pointer;transition:all .18s;-webkit-appearance:none;letter-spacing:.01em}
.btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 24px rgba(255,10,43,.3)}
.btn-red:active{transform:scale(.97);box-shadow:0 2px 10px rgba(255,10,43,.2)}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text)}
.btn-ghost:active{background:rgba(255,255,255,.12)}

/* ── BACK ── */
.back{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;padding:0;margin-bottom:18px;-webkit-appearance:none}

/* ── QUINIELA MENU ── */
.q-hero-wrap{border-radius:24px;padding:28px 20px;text-align:center;margin-bottom:16px;background:linear-gradient(135deg,rgba(255,184,0,.15),rgba(217,119,6,.08));border:1px solid rgba(255,184,0,.22)}
.q-trophy{font-size:64px;margin-bottom:10px;filter:drop-shadow(0 4px 20px rgba(255,184,0,.4))}
.q-score-box{border-radius:var(--r-sm);padding:13px 15px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.q-score-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.q-pts{font-weight:900;color:var(--gold);font-size:13px}

/* ── SETUP ── */
.si-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;margin-bottom:8px;transition:border-color .2s}
.si-row:focus-within{border-color:rgba(255,10,43,.4)}
.si-num{color:var(--red);font-weight:900;font-size:13px;width:20px;text-align:center;flex-shrink:0}
.si-in{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-weight:600;outline:none;font-family:inherit;-webkit-appearance:none}
.si-in::placeholder{color:#2A3042}

/* ── LEADERBOARD ── */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:145px;margin-bottom:22px}
.pod-item{flex:1;display:flex;flex-direction:column;align-items:center;max-width:110px}
.pod-name{font-size:10px;font-weight:800;text-align:center;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 4px}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.pod-pts{font-size:20px;font-weight:900;color:#fff}
.lb-row{display:flex;align-items:center;gap:10px;border-radius:16px;padding:13px 15px;margin-bottom:7px;cursor:pointer;border:1px solid var(--border);background:var(--surface);transition:all .15s}
.lb-row:active{background:rgba(255,255,255,.09);transform:scale(.99)}
.lb-rank{font-size:19px;font-weight:900;width:28px;text-align:center;flex-shrink:0}
.lb-info{flex:1}
.lb-name{font-size:14px;font-weight:800}
.lb-detail{font-size:11px;color:var(--muted);margin-top:2px}
.lb-pts{font-size:24px;font-weight:900;color:var(--gold);line-height:1}
.lb-ptslbl{font-size:9px;color:var(--muted);font-weight:700;text-align:right}
.lb-arr{color:var(--muted)}

/* ── PREDICT ── */
.pd-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.pd-pts-badge{border-radius:15px;padding:9px 15px;text-align:center;background:rgba(255,184,0,.12);border:1px solid rgba(255,184,0,.25)}
.pd-pts-lbl{font-size:9px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.pd-pts-val{font-size:26px;font-weight:900;color:var(--gold);line-height:1.1}

/* CHAMPION SECTION */
.champ-box{border-radius:20px;padding:15px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,184,0,.12),rgba(217,119,6,.06));border:1px solid rgba(255,184,0,.22)}
.champ-lbl{font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.team-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:175px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.team-grid::-webkit-scrollbar{display:none}
.tc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 3px;border-radius:11px;border:none;cursor:pointer;background:rgba(255,255,255,.06);transition:all .16s;-webkit-appearance:none}
.tc:active{transform:scale(.88)}
.tc.sel{background:var(--gold);box-shadow:0 4px 16px rgba(255,184,0,.3);transform:scale(1.06)}
.tc-flag{font-size:22px;line-height:1}
.tc-code{font-size:8px;font-weight:800;color:var(--sub)}
.tc.sel .tc-code{color:rgba(0,0,0,.7)}
.champ-sel{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.25);border-radius:12px;padding:9px 12px;margin-top:10px}

/* SCORER */
.scorer-box{border-radius:18px;padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border)}
.scorer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sc-btn{padding:9px 10px;border-radius:10px;border:none;cursor:pointer;background:rgba(255,255,255,.06);color:var(--sub);font-size:11.5px;font-weight:700;text-align:left;transition:all .15s;-webkit-appearance:none;font-family:inherit}
.sc-btn.sel{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(255,10,43,.25)}
.sc-btn:active{opacity:.7}

/* PREDICT MATCHES */
.pd-round-lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 9px}
.pm{border-radius:16px;padding:12px 13px;margin-bottom:8px;border:1px solid var(--border);background:var(--surface)}
.pm.correct{border-color:rgba(0,200,83,.35);background:rgba(0,200,83,.07)}
.pm.wrong{border-color:rgba(255,10,43,.25);background:rgba(255,10,43,.05)}
.pm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pm-date{font-size:10px;color:var(--muted);font-weight:700}
.pm-info{display:flex;align-items:center;gap:7px}
.pm-result{font-size:13px;font-weight:900}
.pm-pts{font-size:10px;font-weight:800}
.pm-pts.g{color:var(--green)}.pm-pts.r{color:var(--red)}.pm-pts.y{color:var(--gold)}
.pick-row{display:grid;grid-template-columns:1fr 70px 1fr;gap:6px}
.pb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:13px;border:none;cursor:pointer;background:rgba(255,255,255,.06);transition:all .17s;-webkit-appearance:none;font-family:inherit}
.pb:active{transform:scale(.9)}
.pb.sel{background:var(--red);box-shadow:0 4px 14px rgba(255,10,43,.25)}
.pb.sel-ok{background:var(--green);box-shadow:0 4px 14px rgba(0,200,83,.2)}
.pb.sel-ko{background:rgba(220,50,50,.65)}
.pb.actual{background:rgba(255,255,255,.14)}
.pb[disabled]{cursor:default}
.pb-flag{font-size:24px;line-height:1}
.pb-code{font-size:9px;font-weight:800;color:var(--muted)}
.pb.sel .pb-code,.pb.sel-ok .pb-code,.pb.sel-ko .pb-code{color:rgba(255,255,255,.85)}
.pb-draw{font-size:15px;font-weight:900;color:var(--muted)}
.pb.sel .pb-draw{color:#fff}

/* RESET BTN */
.reset-btn{font-size:10px;color:#2C3347;border:none;background:none;cursor:pointer;font-weight:700;padding:4px;-webkit-appearance:none}
.reset-btn:active{color:var(--red)}

/* EMPTY */
.empty{text-align:center;color:var(--muted);padding:70px 0;font-size:14px;font-weight:500}

/* ── ANIMATIONS ── */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}

/* ── BRACKET ── */
.bracket-wrap{overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bracket-wrap::-webkit-scrollbar{display:none}
.bracket-match{border-radius:12px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;min-width:190px}
.bm-date{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:6px}
.bm-team{display:flex;align-items:center;gap:7px;padding:3px 0}
.bm-score{margin-left:auto;font-size:13px;font-weight:900}
.bm-team.winner .bm-name{color:#fff;font-weight:700}
.bm-name{font-size:12px;font-weight:600;color:var(--sub);flex:1}
.bm-flag{font-size:18px}
.bm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<script>
window.onerror=function(msg,src,line,col,err){
  var c=document.getElementById('content');
  if(c)c.innerHTML='<div style="color:#F0F2F8;padding:30px 16px;font-family:monospace;font-size:12px"><b style="color:#FF0A2B;font-size:16px">ERROR</b><br><br>'+msg+'<br><br>Línea: '+line+'<br><br>'+err+'</div>';
  return true;
};
</script>
<div id="app">
  <div id="content">
    <div id="init-msg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px 24px;gap:12px">
      <div style="font-size:52px">⚽</div>
      <div style="font-size:20px;font-weight:900;color:#F0F2F8">Mundial 2026</div>
      <div style="font-size:13px;color:#5C6478">Cargando...</div>
    </div>
    <noscript>
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:16px">

function st(grp){
  const r={};G[grp].forEach(c=>r[c]={c,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0})
  M.filter(m=>m.grp===grp&&m.s==='played'&&m.r).forEach(m=>{
    const[hg,ag]=m.r,h=r[m.h],a=r[m.a]
    if(!h||!a)return
    h.p++;h.gf+=hg;h.ga+=ag;h.gd=h.gf-h.ga
    a.p++;a.gf+=ag;a.ga+=hg;a.gd=a.gf-a.ga
    if(hg>ag){h.w++;h.pts+=3;a.l++}else if(hg<ag){a.w++;a.pts+=3;h.l++}else{h.d++;h.pts++;a.d++;a.pts++}
  })
  return Object.values(r).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)
}
function calcPts(fr){
  let p=0;(fr.predictions||[]).forEach(pp=>{
    const m=M.find(x=>x.id===pp.mid)
    if(!m||m.s!=='played'||!m.r)return
    const[hg,ag]=m.r,ac=hg>ag?'h':hg<ag?'a':'d'
    if(pp.pick===ac)p+=RPTS[m.round]||2
  });return p
}
function fmtD(ds){return new Date(ds+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function sdD(ds){const[,mm,dd]=ds.split('-');return`${dd}/${mm}`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function rQLB(){

function rQPredict(){
  if(!Q||!AF)return rQLB()
  const fr=Q.friends.find(f=>f.id===AF)
  if(!fr)return rQLB()
  const pts=calcPts(fr)
  const ko=M.filter(m=>['r32','r16','qf','sf','final'].includes(m.round))
  let h=`<div class="page">
    <button class="back" onclick="qv('lb')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Atrás
    </button>
    <div class="pd-hd">
      <div><div class="title">${esc(fr.name)}</div><div class="subtitle">Toca para elegir</div></div>
      <div class="pd-pts-badge"><div class="pd-pts-lbl">Puntos</div><div class="pd-pts-val">${pts}</div></div>
    </div>`

  // Champion
  h+=`<div class="champ-box"><div class="champ-lbl">Campeón del Mundo</div>
    <div class="team-grid">`
  Object.keys(T).forEach(code=>{
    const t=T[code],sel=fr.champion===code
    h+=`<button class="tc ${sel?'sel':''}" onclick="pChamp('${fr.id}','${code}')">
      <span class="tc-flag">${t.f}</span><span class="tc-code">${code}</span>
    </button>`
  })
  h+=`</div>`
  if(fr.champion){
    h+=`<div class="champ-sel"><span style="font-size:28px">${T[fr.champion].f}</span>
      <span style="font-size:13px;font-weight:700">${esc(T[fr.champion].n)}</span>
      <span style="margin-left:auto;font-size:18px">✓</span></div>`
  }
  h+=`</div>`

  // Scorer
  h+=`<div class="scorer-box"><div class="section-hd" style="margin-top:0">Pichichi (Goleador)</div>
    <div class="scorer-grid">`
  SCORERS.forEach(nm=>{
    h+=`<button class="sc-btn ${fr.topScorer===nm?'sel':''}" onclick="pScorer('${fr.id}','${esc(nm)}')">${esc(nm)}</button>`
  })
  h+=`</div></div>`

  // Matches
  ;['r32','r16','qf','sf'].forEach(round=>{
    const rms=ko.filter(m=>m.round===round)
    if(!rms.length)return
    h+=`<div class="pd-round-lbl">${RNAMES[round]||round}</div>`
    rms.forEach(m=>{
      const hh=T[m.h],ah=T[m.a]
      const pred=fr.predictions?.find(p=>p.mid===m.id)
      let ac=null
      if(m.r){const[hg,ag]=m.r;ac=hg>ag?'h':hg<ag?'a':'d'}
      const ok=pred&&ac&&pred.pick===ac,ko2=pred&&ac&&pred.pick!==ac
      const rp=RPTS[round]||2
      h+=`<div class="pm ${ok?'correct':ko2?'wrong':''}">
        <div class="pm-top">
          <span class="pm-date">${sdD(m.date)} · ${m.time}</span>
          <div class="pm-info">
            ${m.r?`<span class="pm-result">${m.r[0]}–${m.r[1]}</span>`:''}
            ${ok?`<span class="pm-pts g">+${rp}pts</span>`:ko2?`<span class="pm-pts r">✗</span>`:`<span class="pm-pts y">${rp}pts</span>`}
          </div>
        </div>
        <div class="pick-row">`
      ;[['h',hh.f,m.h],['d','','X'],['a',ah.f,m.a]].forEach(([pick,flag,code])=>{
        const isSel=pred?.pick===pick,isAc=ac===pick
        let cls='pb'
        if(isSel&&ok)cls+=' sel-ok'
        else if(isSel&&ko2)cls+=' sel-ko'
        else if(isSel)cls+=' sel'
        else if(isAc&&!isSel)cls+=' actual'
        h+=`<button class="${cls}" ${m.r?'disabled':''} onclick="pMatch('${fr.id}','${m.id}','${pick}')">
          ${flag?`<span class="pb-flag">${flag}</span>`:`<span class="pb-draw">X</span>`}
          <span class="pb-code">${code}</span>
        </button>`
      })
      h+=`</div></div>`
    })
  })
  h+=`</div>`;return h
}

function qv(v){QV=v;document.getElementById('content').innerHTML=rQ();document.getElementById('content').scrollTop=0}

function createQ(){
  const names=SN.map(n=>n.trim()).filter(Boolean)

function pChamp(fid,code){
  const fr=Q.friends.find(f=>f.id===fid);if(!fr)return
  fr.champion=fr.champion===code?'':code;saveQ()
  document.getElementById('content').innerHTML=rQPredict()

function pScorer(fid,name){
  const fr=Q.friends.find(f=>f.id===fid);if(!fr)return
  fr.topScorer=fr.topScorer===name?'':name;saveQ()
  document.getElementById('content').innerHTML=rQPredict()
}
function pMatch(fid,mid,pick){
  const fr=Q.friends.find(f=>f.id===fid);if(!fr)return
  if(!fr.predictions)fr.predictions=[]
  const idx=fr.predictions.findIndex(p=>p.mid===mid)
  if(idx>=0)fr.predictions.splice(idx,1)
  fr.predictions.push({mid,pick});saveQ()
  document.getElementById('content').innerHTML=rQPredict()
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  const c=document.getElementById('content')
  if(TAB==='home')c.innerHTML=rHome()
  else if(TAB==='grupos')c.innerHTML=rGrupos()
  else if(TAB==='fixture')c.innerHTML=rFixture()
  else if(TAB==='quiniela')c.innerHTML=rQ()
}

// Swipe navigation
let sx=0,sy=0
document.addEventListener('touchstart',function(ev){sx=ev.touches[0].clientX;sy=ev.touches[0].clientY},{passive:true})
document.addEventListener('touchend',function(ev){
  const dx=ev.changedTouches[0].clientX-sx,dy=ev.changedTouches[0].clientY-sy
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    const tabs=['home','grupos','fixture','quiniela'],i=tabs.indexOf(TAB)
    if(dx<0&&i<tabs.length-1)go(tabs[i+1])
    else if(dx>0&&i>0)go(tabs[i-1])
  }
},{passive:true})

// Init
function init(){
  try{
    if(Q)document.getElementById('q-pip').style.display='block'
    render()
  }catch(err){
    document.getElementById('content').innerHTML=
      '<div style="color:#F0F2F8;padding:40px 20px;text-align:center"><div style="font-size:40px">⚠️</div><div style="font-size:16px;font-weight:700;margin-top:12px">Error al cargar</div><div style="font-size:12px;color:#5C6478;margin-top:8px">'+err+'</div></div>'
  }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
</script>
